<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="About Manoj Kumar Sinha (mk): robotics, data science and microgravity research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>About mk - Manoj Kumar Sinha</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#17214a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="1" stop-color="#ff6f4d"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="480" rx="18"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .ink { fill: #e8eefc; }
    .muted { fill: #8fa0c8; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    .role { opacity: 0; animation: roles 12s infinite; }
    @keyframes roles { 0% {opacity:0} 4% {opacity:1} 30% {opacity:1} 34% {opacity:0} 100% {opacity:0} }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0 } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .role:not(.r1) { opacity: 0 !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="480" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#bfe3ff">
      <circle class="twinkle" cx="60" cy="40" r="1.4" style="animation-delay:0s"/>
      <circle class="twinkle" cx="310" cy="26" r="1.2" style="animation-delay:.8s"/>
      <circle class="twinkle" cx="520" cy="60" r="1.6" style="animation-delay:1.6s"/>
      <circle class="twinkle" cx="860" cy="44" r="1.3" style="animation-delay:.4s"/>
      <circle class="twinkle" cx="470" cy="440" r="1.4" style="animation-delay:2.1s"/>
      <circle class="twinkle" cx="880" cy="420" r="1.2" style="animation-delay:1.1s"/>
      <circle class="twinkle" cx="590" cy="250" r="1.1" style="animation-delay:2.4s"/>
      <circle class="twinkle" cx="780" cy="100" r="1.5" style="animation-delay:1.9s"/>
    </g>

    <!-- LEFT: identity -->
    <text class="serif rise" x="44" y="82" font-size="40" fill="url(#name)" style="animation-delay:.1s">Manoj Kumar Sinha</text>
    <text class="rise muted" x="46" y="108" font-size="15" style="animation-delay:.3s">you can call me mk</text>

    <!-- cycling headline -->
    <g font-size="17" fill="#ff9d82">
      <text class="role r1" x="46" y="146" style="animation-delay:0s">Second-year B.Tech CSE (Data Science), Bhilai</text>
      <text class="role" x="46" y="146" style="animation-delay:4s">I build robots, models and developer tools</text>
      <text class="role" x="46" y="146" style="animation-delay:8s">Researching how bodies behave in microgravity</text>
    </g>

    <!-- experience rows -->
    <g font-size="15">
      <g class="rise" style="animation-delay:.9s">
        <rect x="44" y="172" width="440" height="40" rx="10" fill="#131c3a" stroke="#27345f"/>
        <circle cx="64" cy="192" r="5" fill="#ff8a6b"/>
        <text class="ink" x="80" y="197">President, Nextronix Robotics Club</text>
      </g>
      <g class="rise" style="animation-delay:1.2s">
        <rect x="44" y="222" width="440" height="40" rx="10" fill="#131c3a" stroke="#27345f"/>
        <circle cx="64" cy="242" r="5" fill="#7be0c3"/>
        <text class="ink" x="80" y="247">Research intern, THINK Lab at NIT Raipur</text>
      </g>
      <g class="rise" style="animation-delay:1.5s">
        <rect x="44" y="272" width="440" height="40" rx="10" fill="#131c3a" stroke="#27345f"/>
        <circle cx="64" cy="292" r="5" fill="#bfe3ff"/>
        <text class="ink" x="80" y="297">Summership 2026, Vicharanashala Lab at IIT Ropar</text>
      </g>
      <g class="rise" style="animation-delay:1.8s">
        <rect x="44" y="322" width="440" height="40" rx="10" fill="#131c3a" stroke="#27345f"/>
        <circle cx="64" cy="342" r="5" fill="#ffd36b"/>
        <text class="ink" x="80" y="347">Founder, DevKicks: earning for Indian developers in VS Code</text>
      </g>
    </g>

    <!-- currently building -->
    <g class="rise" style="animation-delay:2.2s" font-size="13">
      <text class="muted" x="46" y="392">Lately building</text>
      <g>
        <rect x="46" y="402" width="112" height="26" rx="13" fill="none" stroke="#ff8a6b"/>
        <text class="ink" x="102" y="420" text-anchor="middle">RAG platform</text>
        <rect x="166" y="402" width="116" height="26" rx="13" fill="none" stroke="#7be0c3"/>
        <text class="ink" x="224" y="420" text-anchor="middle">Smart Goggles</text>
        <rect x="290" y="402" width="124" height="26" rx="13" fill="none" stroke="#bfe3ff"/>
        <text class="ink" x="352" y="420" text-anchor="middle">ThermoGrav-Bone</text>
        <rect x="422" y="402" width="62" height="26" rx="13" fill="none" stroke="#ffd36b"/>
        <text class="ink" x="453" y="420" text-anchor="middle">Kaggle</text>
      </g>
    </g>

    <!-- footer -->
    <text class="muted" x="46" y="458" font-size="14">github.com/mksinha01</text>
    <rect class="blink" x="190" y="446" width="8" height="15" fill="#ff8a6b"/>

    <!-- RIGHT: weightless orbit system -->
    <g>
      <ellipse cx="700" cy="240" rx="150" ry="150" fill="none" stroke="#27345f" stroke-dasharray="3 7"/>
      <ellipse cx="700" cy="240" rx="92" ry="92" fill="none" stroke="#27345f" stroke-dasharray="3 7"/>

      <!-- core -->
      <g class="bob">
        <circle cx="700" cy="240" r="48" fill="url(#core)"/>
        <text class="serif" x="700" y="251" text-anchor="middle" font-size="32" fill="#0b1226">mk</text>
      </g>

      <!-- inner orbit -->
      <g>
        <circle r="6" fill="#7be0c3">
          <animateMotion dur="14s" repeatCount="indefinite" begin="0s" path="M608,240 a92,92 0 1,0 184,0 a92,92 0 1,0 -184,0"/>
        </circle>
        <circle r="6" fill="#ffd36b">
          <animateMotion dur="14s" repeatCount="indefinite" begin="-7s" path="M608,240 a92,92 0 1,0 184,0 a92,92 0 1,0 -184,0"/>
        </circle>
      </g>

      <!-- outer orbit with labelled nodes -->
      <g font-size="13">
        <g>
          <animateMotion dur="26s" repeatCount="indefinite" begin="0s" path="M550,240 a150,150 0 1,0 300,0 a150,150 0 1,0 -300,0"/>
          <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#131c3a" stroke="#ff8a6b"/>
          <text class="ink" y="5" text-anchor="middle">Robotics</text>
        </g>
        <g>
          <animateMotion dur="26s" repeatCount="indefinite" begin="-6.5s" path="M550,240 a150,150 0 1,0 300,0 a150,150 0 1,0 -300,0"/>
          <rect x="-52" y="-14" width="104" height="28" rx="14" fill="#131c3a" stroke="#7be0c3"/>
          <text class="ink" y="5" text-anchor="middle">Data Science</text>
        </g>
        <g>
          <animateMotion dur="26s" repeatCount="indefinite" begin="-13s" path="M550,240 a150,150 0 1,0 300,0 a150,150 0 1,0 -300,0"/>
          <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#131c3a" stroke="#bfe3ff"/>
          <text class="ink" y="5" text-anchor="middle">Microgravity</text>
        </g>
        <g>
          <animateMotion dur="26s" repeatCount="indefinite" begin="-19.5s" path="M550,240 a150,150 0 1,0 300,0 a150,150 0 1,0 -300,0"/>
          <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#131c3a" stroke="#ffd36b"/>
          <text class="ink" y="5" text-anchor="middle">DevKicks</text>
        </g>
      </g>
    </g>
  </g>
</svg>