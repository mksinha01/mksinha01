<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manoj Kumar Sinha — Profile Preview</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .card {
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Profile Card Previews</h1>
  
  <div class="card">
    <img src="hero.svg" alt="Hero Card">
  </div>
  
  <div class="card">
    <img src="about-life.svg" alt="About & Life">
  </div>

  <div class="card">
    <img src="stack.svg" alt="Tech Stack">
  </div>

  <div class="card">
    <img src="id-dashboard.svg" alt="ID Dashboard">
  </div>

  <div class="card">
    <img src="connect.svg" alt="Connect">
  </div>
</body>
</html>
