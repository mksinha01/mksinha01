<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Manoj Kumar Sinha (mk): robotics, AI and microgravity research" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>mk - Manoj Kumar Sinha</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#1a2552"/>
    </linearGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
    <radialGradient id="drop" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".25" stop-color="#bfe3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4f7bd9" stop-opacity=".35"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="340" rx="20"/></clipPath>
    <clipPath id="c1"><rect class="tp tp1" x="56" y="196" width="0" height="40"/></clipPath>
    <clipPath id="c2"><rect class="tp tp2" x="56" y="196" width="0" height="40"/></clipPath>
    <clipPath id="c3"><rect class="tp tp3" x="56" y="196" width="0" height="40"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .mono { font-family: Consolas, "SF Mono", "Courier New", monospace; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .tp { animation: type 15s infinite; }
    .tp1 { animation-timing-function: steps(21,end); }
    .tp2 { animation-timing-function: steps(23,end); animation-delay: 5s; }
    .tp3 { animation-timing-function: steps(20,end); animation-delay: 10s; }
    @keyframes type { 0% { width: 0 } 13% { width: 330px } 31% { width: 330px } 31.1% { width: 0 } 100% { width: 0 } }
    .cur { opacity: 0; animation: curs 15s infinite; }
    @keyframes curs { 0% {opacity:1; transform: translateX(0)} 13% {opacity:1; transform: translateX(290px)} 31% {opacity:1; transform: translateX(290px)} 31.1% {opacity:0; transform: translateX(0)} 100% {opacity:0; transform: translateX(0)} }
    .cur1 { animation-timing-function: steps(21,end); }
    .cur2 { animation-timing-function: steps(23,end); animation-delay: 5s; }
    .cur3 { animation-timing-function: steps(20,end); animation-delay: 10s; }
    .blink { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0 } }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    .float { animation: fl 7s ease-in-out infinite; }
    @keyframes fl { 0%,100% { transform: translate(0,0) } 33% { transform: translate(6px,-10px) } 66% { transform: translate(-5px,-4px) } }
    .wobble { transform-box: fill-box; transform-origin: center; animation: wb 5s ease-in-out infinite; }
    @keyframes wb { 0%,100% { transform: scale(1,1) } 50% { transform: scale(1.06,.94) } }
    .flow { stroke-dasharray: 5 7; animation: fw 2.5s linear infinite; }
    @keyframes fw { to { stroke-dashoffset: -24 } }
    .pulse { animation: pl 2.4s ease-in-out infinite; }
    @keyframes pl { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 1 !important; } .tp1 { width: 330px !important; } .cur { display: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#bfe3ff">
      <circle class="twinkle" cx="420" cy="34" r="1.4"/>
      <circle class="twinkle" cx="610" cy="300" r="1.3" style="animation-delay:1s"/>
      <circle class="twinkle" cx="700" cy="40" r="1.6" style="animation-delay:1.8s"/>
      <circle class="twinkle" cx="960" cy="150" r="1.2" style="animation-delay:.6s"/>
      <circle class="twinkle" cx="520" cy="190" r="1.1" style="animation-delay:2.2s"/>
      <circle class="twinkle" cx="40" cy="300" r="1.3" style="animation-delay:1.4s"/>
    </g>

    <!-- text -->
    <text class="rise" x="58" y="82" font-size="18" fill="#ff9d82" style="animation-delay:.1s">Hi, I'm</text>
    <text class="rise serif" x="56" y="150" font-size="60" fill="url(#nm)" style="animation-delay:.3s">Manoj Kumar Sinha</text>
    <text class="rise" x="58" y="180" font-size="16" fill="#8fa0c8" style="animation-delay:.6s">mk, Bhilai. President of Nextronix Robotics Club, founder of DevKicks.</text>

    <!-- typed roles -->
    <g clip-path="url(#c1)"><text class="mono" x="56" y="226" font-size="24" fill="#7be0c3">Robotics + AI builder</text></g>
    <g clip-path="url(#c2)"><text class="mono" x="56" y="226" font-size="24" fill="#ffd36b">Microgravity researcher</text></g>
    <g clip-path="url(#c3)"><text class="mono" x="56" y="226" font-size="24" fill="#bfe3ff">Data Science student</text></g>
    <rect class="cur cur1" x="56" y="206" width="10" height="24" fill="#ff8a6b"/>
    <rect class="cur cur2" x="56" y="206" width="10" height="24" fill="#ff8a6b"/>
    <rect class="cur cur3" x="56" y="206" width="10" height="24" fill="#ff8a6b"/>

    <!-- badges -->
    <g class="rise" style="animation-delay:1.2s" font-size="14">
      <rect x="56" y="262" width="168" height="34" rx="17" fill="#131c3a" stroke="#ff8a6b"/>
      <text x="140" y="284" text-anchor="middle" fill="#e8eefc">THINK Lab, NIT Raipur</text>
      <rect x="234" y="262" width="176" height="34" rx="17" fill="#131c3a" stroke="#7be0c3"/>
      <text x="322" y="284" text-anchor="middle" fill="#e8eefc">Vicharanashala, IIT Ropar</text>
      <rect x="420" y="262" width="168" height="34" rx="17" fill="#131c3a" stroke="#ffd36b"/>
      <text x="504" y="284" text-anchor="middle" fill="#e8eefc">github.com/mksinha01</text>
    </g>

    <!-- RIGHT: gear + network + floating droplet -->
    <!-- gear (robotics) -->
    <g transform="translate(790 110)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <circle r="52" fill="none" stroke="#ff8a6b" stroke-width="14" stroke-dasharray="11 9.2"/>
        <circle r="42" fill="#131c3a" stroke="#ff8a6b" stroke-width="3"/>
        <circle r="14" fill="#0b1226" stroke="#ff8a6b" stroke-width="3"/>
        <line x1="-42" y1="0" x2="-14" y2="0" stroke="#ff8a6b" stroke-width="3"/>
        <line x1="14" y1="0" x2="42" y2="0" stroke="#ff8a6b" stroke-width="3"/>
        <line x1="0" y1="-42" x2="0" y2="-14" stroke="#ff8a6b" stroke-width="3"/>
        <line x1="0" y1="14" x2="0" y2="42" stroke="#ff8a6b" stroke-width="3"/>
      </g>
    </g>

    <!-- small counter-rotating gear -->
    <g transform="translate(868 168)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
        <circle r="26" fill="none" stroke="#ffd36b" stroke-width="9" stroke-dasharray="7 6.2"/>
        <circle r="20" fill="#131c3a" stroke="#ffd36b" stroke-width="2.5"/>
        <circle r="6" fill="#0b1226" stroke="#ffd36b" stroke-width="2.5"/>
      </g>
    </g>

    <!-- neural network (AI) -->
    <g stroke="#7be0c3" stroke-width="1.5" fill="none">
      <path class="flow" d="M690 250 L760 220"/>
      <path class="flow" d="M690 250 L760 290"/>
      <path class="flow" d="M690 310 L760 290"/>
      <path class="flow" d="M690 310 L760 220"/>
      <path class="flow" d="M760 220 L840 255"/>
      <path class="flow" d="M760 290 L840 255"/>
      <path class="flow" d="M840 255 L915 255"/>
    </g>
    <g fill="#7be0c3">
      <circle class="pulse" cx="690" cy="250" r="7"/>
      <circle class="pulse" cx="690" cy="310" r="7" style="animation-delay:.4s"/>
      <circle class="pulse" cx="760" cy="220" r="7" style="animation-delay:.8s"/>
      <circle class="pulse" cx="760" cy="290" r="7" style="animation-delay:1.2s"/>
      <circle class="pulse" cx="840" cy="255" r="7" style="animation-delay:1.6s"/>
      <circle class="pulse" cx="915" cy="255" r="9" fill="#ffd36b" style="animation-delay:2s"/>
    </g>

    <!-- weightless droplet (microgravity) -->
    <g class="float">
      <g class="wobble">
        <circle cx="640" cy="105" r="42" fill="url(#drop)" stroke="#bfe3ff" stroke-opacity=".6"/>
        <ellipse cx="626" cy="90" rx="10" ry="6" fill="#ffffff" opacity=".7" transform="rotate(-30 626 90)"/>
      </g>
    </g>
  </g>
</svg>